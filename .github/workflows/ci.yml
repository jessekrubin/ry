name: ci

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE: ${{ startsWith(github.ref, 'refs/tags/') && 'release' || 'release-thin' }}
  RY_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
            manylinux: auto
            features: "mimalloc"
          - runner: ubuntu-latest
            target: x86
            manylinux: auto
            features: "mimalloc"
          - runner: ubuntu-latest
            target: aarch64
            manylinux: "2_28"
            features: "mimalloc"
          - runner: ubuntu-latest
            target: armv7
            manylinux: "2_28"
            features: "mimalloc"
          - runner: ubuntu-latest
            target: s390x
            manylinux: "2_28"
            features: "mimalloc"
          # PPC IS A PAIN IN THE ASS ~ TODO TODO
          # - runner: ubuntu-latest
          #   target: ppc64le
          #   manylinux: "2_28" # previously was 'auto'
          #   features: "mimalloc"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/ry-git-sha
      - name: install-uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: install-python
        run: uv python install 3.11 3.12 3.13 3.14 3.14t 3.15 3.15t pypy3.11
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: v1.15.0
          target: ${{ matrix.platform.target }}
          args: --out dist --interpreter 3.11 3.12 3.13 3.14 3.14t 3.15 3.15t pypy3.11 --profile ${{ env.CARGO_PROFILE }} --features ${{ matrix.platform.features }}
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: ${{ matrix.platform.manylinux }} # SUPER WEIRD BUT ARRRRRRM IS A PITA
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist
      - name: pytest
        if: ${{ startsWith(matrix.platform.target, 'x86_64') }}
        shell: bash
        run: |
          set -e
          python3 -m venv .venv
          source .venv/bin/activate
          pip install ry --no-index --no-deps --find-links dist --force-reinstall
          python -m ry
          pip install -r requirements.dev.txt
          pytest

      - name: pytest
        if: ${{ !startsWith(matrix.platform.target, 'x86') && matrix.platform.target != 'ppc64' }}
        uses: uraimo/run-on-arch-action@fd7aa8593480287702b446a273a68f788a9bad3a # v3
        with:
          arch: ${{ matrix.platform.target }}
          distro: ubuntu22.04
          githubToken: ${{ github.token }}
          dockerRunArgs: |
            --volume "${{ github.workspace }}:/workspace"
            --workdir /workspace
          install: |
            set -euxo pipefail
            apt-get update
            apt-get install -y --no-install-recommends software-properties-common gnupg dirmngr ca-certificates curl tzdata
            add-apt-repository -y ppa:deadsnakes/ppa
            apt-get update
            apt-get install -y --no-install-recommends python3.11 python3.11-venv python3.11-distutils
            curl -sS https://bootstrap.pypa.io/get-pip.py | python3.11
            python3.11 -m pip install -U pip
          run: |
            set -e
            ls -l /workspace/dist
            python3.11 -V
            python3.11 -m pip install ry --no-index --no-deps --find-links /workspace/dist --force-reinstall
            python3.11 -m ry
          # REMOVED (FOR NOW) 2026-08-04
          # python3.11 -m pip install -r /workspace/requirements.dev.txt
          # python3.11 -m pytest

  musllinux:
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-latest
            target: x86
          - runner: ubuntu-latest
            target: aarch64
          - runner: ubuntu-latest
            target: armv7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/ry-git-sha
      - name: install-uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: install-python
        run: uv python install 3.11 3.12 3.13 3.14 3.14t 3.15 3.15t pypy3.11
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: v1.15.0
          target: ${{ matrix.platform.target }}
          args: --out dist --interpreter 3.11 3.12 3.13 3.14 3.14t 3.15 3.15t pypy3.11 --profile ${{ env.CARGO_PROFILE }}
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: musllinux_1_2
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist

      - name: pytest
        if: ${{ startsWith(matrix.platform.target, 'x86_64') }}
        uses: maus007/docker-run-action-fork@5ddaad0f7eedd03f64e412b1931852bd3031b273 # v1
        with:
          image: alpine:latest
          options: -v ${{ github.workspace }}:/io -w /io -e TZ=America/Los_Angeles
          run: |
            set -e
            apk add py3-pip py3-virtualenv tzdata
            python3 -m virtualenv .venv
            source .venv/bin/activate
            pip install ry --no-index --find-links dist --force-reinstall
            pip install -r requirements.dev.txt
            python -m ry
            pytest

      - name: pytest
        if: ${{ !startsWith(matrix.platform.target, 'x86') }}
        uses: uraimo/run-on-arch-action@fd7aa8593480287702b446a273a68f788a9bad3a # v3
        with:
          arch: ${{ matrix.platform.target }}
          distro: alpine_latest
          githubToken: ${{ github.token }}
          env: |
            TZ: America/Los_Angeles
          install: |
            apk add py3-virtualenv tzdata
          run: |
            set -e
            python3 -m virtualenv .venv
            source .venv/bin/activate
            pip install ry --no-index --find-links dist --force-reinstall
            python -m ry
          # tests are super ultra slow
          # pytest
          # pip install -r requirements.dev.txt
  windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
            architecture: x64
          - runner: windows-latest
            target: x86
            architecture: x86
          - runner: windows-11-arm
            target: aarch64
            architecture: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/ry-git-sha
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # python-version: 3.x
          # TODO: enable pypy3.11, 3.13t, 3.14t, 3.15t?
          python-version: |
            3.11
            3.12
            3.13
            3.14
            3.15
          # Need to include architecture: https://github.com/PyO3/maturin-action/issues/375
          architecture: ${{ matrix.platform.architecture }}
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: v1.15.0
          target: ${{ matrix.platform.target }}
          args: --out dist --profile ${{ env.CARGO_PROFILE }} --interpreter 3.11 3.12 3.13 3.14 3.15 --features "mimalloc"
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist
      - name: pytest
        # just test on x64 for now
        if: ${{ matrix.platform.target == 'x64' }}
        shell: bash
        run: |
          set -e
          pip install ry --no-index --no-deps --find-links dist --force-reinstall
          pip install -r requirements.dev.txt
          python -m ry
          pytest

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          # - runner: macos-14
          #   target: aarch64
          - runner: macos-15
            target: aarch64
          # - runner: macos-15-intel # maybe enable?
          #   target: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/ry-git-sha
      - name: install-uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: install-python
        run: uv python install 3.11 3.12 3.13 3.14 3.14t 3.15 3.15t pypy3.11
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: v1.15.0
          target: ${{ matrix.platform.target }}
          args: --out dist --interpreter 3.11 3.12 3.13 3.14 3.14t 3.15 3.15t pypy3.11 --profile ${{ env.CARGO_PROFILE }} --features "mimalloc"
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist
      - name: install-ry
        run: |
          set -e
          python3 -m venv .venv
          source .venv/bin/activate
          pip install ry --no-index --find-links dist --force-reinstall
          python -m ry

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/ry-git-sha
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: v1.15.0
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheels-sdist
          path: dist

  # inspect-artifacts:
  #   name: Inspect Artifacts
  #   runs-on: ubuntu-latest
  #   needs: [linux, musllinux, windows, macos, sdist]
  #   steps:
  #     - name: Download all artifacts
  #       uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
  #     - name: List all files
  #       run: find . -name "wheels-*/*" -o
  #     - name: Inspect wheel files
  #       run: |
  #         set -e
  #         for whl in $(find . -name "wheels-*/*"); do
  #           echo "========================================"
  #           echo "Inspecting $whl"
  #           python3 -m pip install wheel
  #           python3 -m wheel unpack "$whl" -d unpacked
  #           pkg_dir=$(basename "$whl" .whl)
  #           echo "Contents of $pkg_dir/METADATA:"
  #           cat "unpacked/$pkg_dir/METADATA"
  #           echo "----------------------------------------"
  #         done

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [linux, musllinux, windows, macos, sdist]
    environment:
      name: release-pypi
      url: https://pypi.org/p/ry
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: list-files
        run: ls -l dist
      - name: install-uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: check-dists
        run: |
          set -e
          for whl in dist/*.whl; do unzip -qt "$whl"; done
          uvx twine check --strict dist/*
      - name: generate-artifact-attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: "dist/*"
      - name: publish-2-pypi
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
      - name: gh-release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes dist/*.whl dist/*.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
